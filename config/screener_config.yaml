# ============================================================
# Screener Configuration — Nifty 100 Financial Intelligence
# ============================================================

# 15 filterable metrics with source table, column name, filter direction
metrics:
  roe_min:
    label: "Return on Equity (%)"
    column: return_on_equity_pct
    table: financial_ratios
    direction: min

  de_max:
    label: "Debt to Equity"
    column: debt_to_equity
    table: financial_ratios
    direction: max
    financials_de_exempt: true   # Skip Financials sector when this filter is applied

  fcf_min:
    label: "Free Cash Flow (Cr)"
    column: free_cash_flow_cr
    table: financial_ratios
    direction: min

  revenue_cagr_5yr_min:
    label: "Revenue CAGR 5yr (%)"
    column: revenue_cagr_5yr
    table: financial_ratios
    direction: min

  revenue_cagr_3yr_min:
    label: "Revenue CAGR 3yr (%)"
    column: revenue_cagr_3yr
    table: financial_ratios
    direction: min

  pat_cagr_5yr_min:
    label: "PAT CAGR 5yr (%)"
    column: pat_cagr_5yr
    table: financial_ratios
    direction: min

  opm_min:
    label: "Operating Profit Margin (%)"
    column: operating_profit_margin_pct
    table: financial_ratios
    direction: min

  pe_max:
    label: "Price to Earnings (P/E)"
    column: pe_ratio
    table: market_data
    direction: max

  pb_max:
    label: "Price to Book (P/B)"
    column: pb_ratio
    table: market_data
    direction: max

  dividend_yield_min:
    label: "Dividend Yield (%)"
    column: dividend_yield_pct
    table: market_data
    direction: min

  icr_min:
    label: "Interest Coverage Ratio"
    column: interest_coverage
    table: financial_ratios
    direction: min
    debt_free_as_infinity: true  # icr_label='Debt Free' always passes

  market_cap_min:
    label: "Market Cap (Cr)"
    column: market_cap_crore
    table: market_data
    direction: min

  net_profit_min:
    label: "Net Profit (Cr)"
    column: net_profit
    table: profit_and_loss
    direction: min

  eps_cagr_5yr_min:
    label: "EPS CAGR 5yr (%)"
    column: eps_cagr_5yr
    table: financial_ratios
    direction: min

  asset_turnover_min:
    label: "Asset Turnover"
    column: asset_turnover
    table: financial_ratios
    direction: min

  sales_min:
    label: "Revenue / Sales (Cr)"
    column: sales
    table: profit_and_loss
    direction: min

  dividend_payout_max:
    label: "Dividend Payout (%)"
    column: dividend_payout_ratio_pct
    table: financial_ratios
    direction: max

# ============================================================
# 6 Preset Screeners
# ============================================================

presets:
  quality_compounder:
    label: "Quality Compounder"
    description: "High ROE, low debt, positive FCF and strong revenue growth"
    filters:
      roe_min: 15.0
      de_max: 1.0
      fcf_min: 0.0
      revenue_cagr_5yr_min: 10.0

  value_pick:
    label: "Value Pick"
    description: "Attractively priced stocks with low P/E, P/B and decent dividends"
    filters:
      pe_max: 20.0
      pb_max: 3.0
      de_max: 2.0
      dividend_yield_min: 1.0

  growth_accelerator:
    label: "Growth Accelerator"
    description: "High PAT and revenue growth with manageable leverage"
    filters:
      pat_cagr_5yr_min: 20.0
      revenue_cagr_5yr_min: 15.0
      de_max: 2.0

  dividend_champion:
    label: "Dividend Champion"
    description: "Strong and sustainable dividends with positive FCF"
    filters:
      dividend_yield_min: 2.0
      dividend_payout_max: 80.0
      fcf_min: 0.0

  debt_free_blue_chip:
    label: "Debt-Free Blue Chip"
    description: "Zero-debt large cap companies with solid ROE"
    filters:
      de_max: 0.1      # near-zero D/E
      roe_min: 12.0
      sales_min: 5000.0

  turnaround_watch:
    label: "Turnaround Watch"
    description: "Companies showing revenue recovery and improving FCF"
    filters:
      revenue_cagr_3yr_min: 10.0
      fcf_min: 0.0
      # D/E declining YoY is handled programmatically in engine.py
      de_declining_yoy: true
